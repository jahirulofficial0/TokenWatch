<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TokenWatch — AI Token &amp; Rate-Limit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22d3ee}a:hover{color:#67e8f9}
.tw-project-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;padding:6px;border-radius:12px;border:1px solid rgba(159,179,209,0.22);background:rgba(5,11,24,0.97);box-shadow:0 18px 40px rgba(0,0,0,0.55);display:none;flex-direction:column;gap:2px}
.tw-project-menu.open{display:flex}
.tw-project-item{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:#e6f1ff;font-size:13px;cursor:pointer;text-align:left}
.tw-project-item:hover{background:rgba(34,211,238,0.12)}
</style>
</head>
<body>
<div style="width: 440px; box-sizing: border-box; padding: 40px; background: radial-gradient(110% 70% at 50% 0%, #0e2a4a 0%, #071226 55%, #050b18 100%); font-family: Inter, sans-serif; color: #e6f1ff">
<div style="width: 360px; box-sizing: border-box; padding: 20px; border-radius: 16px; background: rgba(16, 30, 58, 0.66); border: 1px solid rgba(103, 232, 249, 0.22); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(34, 211, 238, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.08); backdrop-filter: blur(18px); display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #22d3ee, #4ade80); box-shadow: 0 0 16px rgba(34, 211, 238, 0.45); display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06223a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</div>
<span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em">TokenWatch</span>
<span style="margin-left: auto; font-size: 11px; color: #9fb3d1; display: flex; align-items: center; gap: 6px"><span id="siteDot" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #10a37f; box-shadow: 0 0 8px #10a37f"></span><span id="siteName">ChatGPT</span></span>
</div>

<div style="position: relative">
<button id="projectBtn" aria-label="Select project" style="width: 100%; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(159, 179, 209, 0.22); background: rgba(5, 11, 24, 0.55); color: #e6f1ff; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px">
<span id="projectColor" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 3px; background: #22d3ee"></span>
<span id="projectName" style="font-weight: 600">Cloud Tech ISP Billing</span>
<span id="projectTokens" style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9fb3d1">48.2K</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div id="projectMenu" class="tw-project-menu" role="listbox" aria-label="Projects"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span id="totalLabel" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #9fb3d1">TOTAL TOKENS · TODAY</span>
<div style="display: flex; align-items: baseline; gap: 10px">
<span id="totalValue" style="font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(90deg, #67e8f9, #4ade80); -webkit-background-clip: text; background-clip: text; color: transparent">128,430</span>
<span id="deltaPct" style="font-size: 12px; font-weight: 600; color: #4ade80">+12.4%</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #9fb3d1">Input tokens</span><span id="inputValue" style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #22d3ee">79,612</span></div>
<div style="height: 8px; border-radius: 4px; background: rgba(159, 179, 209, 0.14)"><div id="inputBar" style="width: 62%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #0891b2, #22d3ee); box-shadow: 0 0 10px rgba(34, 211, 238, 0.5)"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #9fb3d1">Output tokens</span><span id="outputValue" style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #4ade80">48,818</span></div>
<div style="height: 8px; border-radius: 4px; background: rgba(159, 179, 209, 0.14)"><div id="outputBar" style="width: 38%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #16a34a, #4ade80); box-shadow: 0 0 10px rgba(74, 222, 128, 0.5)"></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: rgba(5, 11, 24, 0.45); border: 1px solid rgba(159, 179, 209, 0.12)">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #9fb3d1">PROJECTS</span>
<div id="projectsGrid" style="display: grid; grid-template-columns: 1fr 90px 52px; gap: 10px; align-items: center; font-size: 12px">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.45); box-shadow: 0 0 22px rgba(245, 158, 11, 0.14)">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #fbbf24">RATE LIMIT</span>
<span id="nearLimitBadge" style="margin-left: auto; font-size: 11px; font-weight: 600; color: #fbbf24; display: flex; align-items: center; gap: 4px">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v4"></path><path d="M12 17.5v.5"></path></svg>Near limit</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 12px; color: #9fb3d1">Resets in</span>
<span id="rlClock" style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: #fde68a">04:37:12</span>
</div>
<div style="height: 10px; border-radius: 5px; background: rgba(159, 179, 209, 0.14)"><div id="rlBar" style="width: 87%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #22d3ee, #f59e0b 70%, #ef4444); box-shadow: 0 0 12px rgba(245, 158, 11, 0.5)"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #9fb3d1"><span id="rlWindowLabel">5-hour window · 87% used</span><span id="rlMsgs" style="font-family: 'JetBrains Mono', monospace">43 / 50 msgs</span></div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<div role="tablist" style="flex: 1 1 auto; display: flex; padding: 4px; border-radius: 12px; background: rgba(5, 11, 24, 0.55); border: 1px solid rgba(159, 179, 209, 0.14)">
<button role="tab" data-range="today" aria-selected="true" style="flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: linear-gradient(135deg, rgba(34,211,238,0.28), rgba(74,222,128,0.22)); color: #e6f1ff; font-size: 12px; font-weight: 600; cursor: pointer">Today</button>
<button role="tab" data-range="week" aria-selected="false" style="flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: transparent; color: #9fb3d1; font-size: 12px; font-weight: 500; cursor: pointer">This Week</button>
<button role="tab" data-range="total" aria-selected="false" style="flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: transparent; color: #9fb3d1; font-size: 12px; font-weight: 500; cursor: pointer">Total</button>
</div>
<button id="settingsBtn" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(159, 179, 209, 0.22); background: rgba(5, 11, 24, 0.55); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9fb3d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</button>
</div>

</div>
</div>
<script src="popup.js"></script>
</body>
</html>
